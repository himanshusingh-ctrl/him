<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Hs Shopping</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eaeded;
            color: #111;
        }

        .header {
            background: #131921;
            color: white;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: #ff9900;
            color: #111;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .title {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 25px;
        }

        .contact-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .contact-box h2 {
            margin-bottom: 20px;
        }

        .contact-item {
            margin-bottom: 20px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 6px;
        }

        .contact-item h3 {
            margin-bottom: 8px;
        }

        .contact-item p {
            color: #555;
        }

        .form-box {
            margin-top: 25px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .form-box h2 {
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: #ff9900;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #e68a00;
        }

        @media (max-width: 600px) {

            .header {
                padding: 15px;
            }

            .container {
                padding: 0 10px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h1>Hs Shopping</h1>

        <a href="index.html" class="back-btn">
            ← Continue Shopping
        </a>

    </div>


    <!-- MAIN CONTENT -->

    <div class="container">

        <h2 class="title">
            Contact Us
        </h2>

        <p class="subtitle">
            We're here to help you with your shopping experience.
        </p>


        <!-- CONTACT INFORMATION -->

        <div class="contact-box">

            <h2>Get in Touch</h2>


            <div class="contact-item">

                <h3>📧 Email Support</h3>

                <p>
                    support@hsshopping.com
                </p>

            </div>


            <div class="contact-item">

                <h3>📞 Phone Support</h3>

                <p>
                    +91 6397548170
                </p>

            </div>


            <div class="contact-item">

                <h3>💬 Customer Support</h3>

                <p>
                    Our support team is available to
                    help you with your questions.
                </p>

            </div>

        </div>


        <!-- CONTACT FORM -->

        <div class="form-box">

            <h2>Send Us a Message</h2>

            <form onsubmit="sendMessage(event)">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <textarea
                    id="message"
                    placeholder="Write your message"
                    required
                ></textarea>

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Send Message
                </button>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function sendMessage(event) {

            event.preventDefault();

            alert("Thank you! Your message has been received.");

        }

    </script>


</body>

</html>
