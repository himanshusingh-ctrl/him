<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returns & Orders - Hs Shopping</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eaeded;
            color: #111;
        }

        .header {
            background: #131921;
            color: white;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: #ff9900;
            color: #111;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .title {
            font-size: 30px;
            margin-bottom: 25px;
        }

        .no-orders {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
        }

        .order-card {
            background: white;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .order-header {
            background: #f3f3f3;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-body {
            padding: 20px;
        }

        .product {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .product:last-child {
            border-bottom: none;
        }

        .product img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .product-info h3 {
            margin-bottom: 8px;
        }

        .product-info p {
            margin: 5px 0;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .address,
        .payment {
            margin-top: 15px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 5px;
        }

        /* DELETE BUTTON */
        .delete-order {
            margin-top: 20px;
            padding: 10px 18px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-order:hover {
            background: #c0392b;
        }

        @media (max-width: 600px) {
            .header {
                padding: 15px;
            }

            .container {
                padding: 0 10px;
            }

            .product {
                align-items: flex-start;
            }

            .product img {
                width: 75px;
                height: 75px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Hs Shopping</h1>
        <a href="index.html" class="back-btn">← Continue Shopping</a>
    </div>

    <div class="container">

        <h2 class="title">Returns & Orders</h2>

        <div id="orders-container"></div>

    </div>

    <script>

        function getOrders() {
            return JSON.parse(localStorage.getItem("hsOrders")) || [];
        }

        const ordersContainer = document.getElementById("orders-container");


        // ================= DISPLAY ORDERS =================

        function displayOrders() {

            const orders = getOrders();

            if (orders.length === 0) {

                ordersContainer.innerHTML = `
                    <div class="no-orders">
                        <h2>No orders yet</h2>
                        <p>Your placed orders will appear here.</p>
                    </div>
                `;

                return;
            }

            ordersContainer.innerHTML = "";

            orders.slice().reverse().forEach(order => {

                const orderCard = document.createElement("div");
                orderCard.className = "order-card";

                const orderHeader = document.createElement("div");
                orderHeader.className = "order-header";

                orderHeader.innerHTML = `
                    <div>
                        <strong>Order ID:</strong> ${order.id}
                    </div>

                    <div>
                        <strong>Date:</strong> ${order.date}
                    </div>
                `;


                const orderBody = document.createElement("div");
                orderBody.className = "order-body";


                order.items.forEach(item => {

                    const product = document.createElement("div");
                    product.className = "product";

                    const img = document.createElement("img");
                    img.src = item.image;
                    img.alt = item.name;

                    const info = document.createElement("div");
                    info.className = "product-info";

                    const name = document.createElement("h3");
                    name.textContent = item.name;

                    const price = document.createElement("p");
                    price.textContent = "Price: ₹" + item.price;

                    const quantity = document.createElement("p");
                    quantity.textContent = "Quantity: " + item.quantity;

                    info.appendChild(name);
                    info.appendChild(price);
                    info.appendChild(quantity);

                    product.appendChild(img);
                    product.appendChild(info);

                    orderBody.appendChild(product);

                });


                const total = document.createElement("div");
                total.className = "total";
                total.textContent = "Total: ₹" + order.total;

                orderBody.appendChild(total);


                // ================= ADDRESS =================

                if (order.address) {

                    const address = document.createElement("div");
                    address.className = "address";

                    const addressTitle = document.createElement("strong");
                    addressTitle.textContent = "Delivery Address";

                    const addressText = document.createElement("p");
                    addressText.textContent = order.address;

                    address.appendChild(addressTitle);
                    address.appendChild(addressText);

                    orderBody.appendChild(address);
                }


                // ================= PAYMENT =================

                if (order.payment) {

                    const payment = document.createElement("div");
                    payment.className = "payment";

                    const paymentTitle = document.createElement("strong");
                    paymentTitle.textContent = "Payment Method";

                    const paymentText = document.createElement("p");
                    paymentText.textContent = order.payment;

                    payment.appendChild(paymentTitle);
                    payment.appendChild(paymentText);

                    orderBody.appendChild(payment);
                }


                // ================= DELETE BUTTON =================

                const deleteButton = document.createElement("button");

                deleteButton.className = "delete-order";
                deleteButton.textContent = "Delete Order";

                deleteButton.addEventListener("click", function() {
                    deleteOrder(order.id);
                });

                orderBody.appendChild(deleteButton);


                orderCard.appendChild(orderHeader);
                orderCard.appendChild(orderBody);

                ordersContainer.appendChild(orderCard);

            });
        }


        // ================= DELETE ORDER =================

        function deleteOrder(orderId) {

            const confirmDelete = confirm(
                "Are you sure you want to delete this order?"
            );

            if (!confirmDelete) {
                return;
            }

            let orders = getOrders();

            orders = orders.filter(order => order.id !== orderId);

            localStorage.setItem(
                "hsOrders",
                JSON.stringify(orders)
            );

            displayOrders();
        }


        // ================= START =================

        displayOrders();

    </script>

</body>
</html>
