<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Gift Card - Hs Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eaeded;
            color: #111;
        }

        header {
            background: #131921;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #ff9900;
        }

        .continue-btn {
            background: #ff9900;
            color: #111;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        .create-btn {
            width: 100%;
            background: #ff9900;
            border: none;
            padding: 14px;
            border-radius: 5px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-btn:hover {
            background: #e68a00;
        }

        .gift-preview {
            margin-top: 30px;
            padding: 25px;
            background: #fff3cd;
            border: 1px solid #ffcc66;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .gift-preview h2 {
            margin-bottom: 15px;
        }

        .gift-amount {
            font-size: 30px;
            font-weight: bold;
            color: #b12704;
            margin: 10px;
        }
    </style>
</head>

<body>

<header>

    <h2>Hs Shopping</h2>

    <a href="gift-cards.html" class="continue-btn">
        Continue Shopping
    </a>

</header>


<div class="container">

    <div class="card">

        <h1>🎁 Create Custom Gift Card</h1>

        <p class="subtitle">
            Create a special gift card for your loved ones.
        </p>


        <form onsubmit="createGiftCard(event)">

            <div class="form-group">

                <label>Gift Card Amount</label>

                <select id="amount" required>

                    <option value="">Select Amount</option>
                    <option value="500">₹500</option>
                    <option value="1000">₹1000</option>
                    <option value="2000">₹2000</option>
                    <option value="5000">₹5000</option>

                </select>

            </div>


            <div class="form-group">

                <label>Recipient Name</label>

                <input
                    type="text"
                    id="recipient"
                    placeholder="Enter recipient name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Sender Name</label>

                <input
                    type="text"
                    id="sender"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Occasion</label>

                <select id="occasion" required>

                    <option value="">Select Occasion</option>
                    <option>Birthday</option>
                    <option>Wedding</option>
                    <option>Anniversary</option>
                    <option>Festival</option>
                    <option>Other</option>

                </select>

            </div>


            <div class="form-group">

                <label>Personal Message</label>

                <textarea
                    id="message"
                    placeholder="Write a special message..."
                    required
                ></textarea>

            </div>


            <button type="submit" class="create-btn">
                Create Gift Card
            </button>

        </form>


        <div class="gift-preview" id="preview">

            <h2>🎉 Gift Card Created!</h2>

            <p>Gift Card Amount</p>

            <div class="gift-amount" id="previewAmount"></div>

            <p>
                To: <strong id="previewRecipient"></strong>
            </p>

            <p>
                From: <strong id="previewSender"></strong>
            </p>

            <br>

            <p id="previewMessage"></p>

        </div>

    </div>

</div>


<script>

function createGiftCard(event) {

    event.preventDefault();

    let amount = document.getElementById("amount").value;
    let recipient = document.getElementById("recipient").value;
    let sender = document.getElementById("sender").value;
    let message = document.getElementById("message").value;

    document.getElementById("preview").style.display = "block";

    document.getElementById("previewAmount").innerText =
        "₹" + amount;

    document.getElementById("previewRecipient").innerText =
        recipient;

    document.getElementById("previewSender").innerText =
        sender;

    document.getElementById("previewMessage").innerText =
        message;

    alert("Your custom gift card has been created successfully!");

}

</script>

</body>
</html>
