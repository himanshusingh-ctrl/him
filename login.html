<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Hs Shopping</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eaeded;
        }

        .login-container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #888;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #ff9900;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #e68a00;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0066c0;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">Hs Shopping</div>

        <h2>Sign In</h2>

        <form id="login-form">

            <label>Email or Mobile</label>
            <input
                type="text"
                id="username"
                placeholder="Enter email or mobile"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Sign In</button>

        </form>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to Hs Shopping
        </a>

    </div>

    <script>

        document
            .getElementById("login-form")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value.trim();

                const message =
                    document.getElementById("message");

                if (username === "" || password === "") {
                    message.textContent = "Please enter all details.";
                    return;
                }

                localStorage.setItem("hsUser", username);

                message.textContent = "Login successful!";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);

            });

    </script>

</body>
</html>
