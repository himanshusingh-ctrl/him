<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>₹500 Gift Card - Hs Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eaeded;
            color: #111;
        }

        header {
            background: #131921;
            color: white;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h2 {
            color: #ff9900;
        }

        .continue-btn {
            background: #ff9900;
            color: #111;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .gift-box {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            text-align: center;
        }

        .gift-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 15px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: #b12704;
            margin: 20px 0;
        }

        .description {
            font-size: 17px;
            color: #555;
            margin-bottom: 25px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .feature {
            background: #f3f3f3;
            padding: 15px;
            border-radius: 8px;
            width: 220px;
        }

        .buy-btn {
            background: #ff9900;
            border: none;
            padding: 13px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #e68a00;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            .container {
                margin: 20px auto;
            }

            .gift-box {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Hs Shopping</h2>

        <a href="gift-cards.html" class="continue-btn">
            Continue Shopping
        </a>
    </header>

    <div class="container">

        <div class="gift-box">

            <div class="gift-icon">🎁</div>

            <h1>₹500 Gift Card</h1>

            <p class="description">
                Give your friends and family the perfect gift for shopping.
            </p>

            <div class="price">₹500</div>

            <div class="features">

                <div class="feature">
                    <h3>Easy to Use</h3>
                    <p>Simple and convenient shopping experience.</p>
                </div>

                <div class="feature">
                    <h3>Perfect Gift</h3>
                    <p>Suitable for birthdays and special occasions.</p>
                </div>

                <div class="feature">
                    <h3>Instant Gift</h3>
                    <p>Gift card details can be shared easily.</p>
                </div>

            </div>

            <button class="buy-btn" onclick="buyGiftCard()">
                Buy ₹500 Gift Card
            </button>

        </div>

    </div>

    <script>

        function buyGiftCard() {
            alert("₹500 Gift Card selected successfully!");
        }

    </script>

</body>
</html>
