<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Hs Shopping</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eaeded;
            color: #111;
        }

        .header {
            background: #131921;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: #ff9900;
            color: #111;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .title {
            font-size: 30px;
            margin-bottom: 25px;
        }

        .cart-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 32px;
            height: 30px;
            border: 1px solid #888;
            background: #f3f3f3;
            cursor: pointer;
            border-radius: 4px;
        }

        .remove-btn {
            margin-top: 10px;
            border: none;
            background: none;
            color: #0066c0;
            cursor: pointer;
        }

        .summary {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            text-align: right;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .checkout-btn {
            display: inline-block;
            background: #ff9900;
            color: #111;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 15px;
            }

            .container {
                padding: 0 10px;
            }

            .cart-item {
                align-items: flex-start;
            }

            .cart-item img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Hs Shopping</h1>

        <a href="index.html" class="back-btn">
            ← Continue Shopping
        </a>
    </div>

    <div class="container">

        <h2 class="title">Shopping Cart</h2>

        <div class="cart-box">

            <div id="cart-items"></div>

            <div id="cart-summary" class="summary"></div>

        </div>

    </div>

    <script>

        let cart = JSON.parse(localStorage.getItem("hsCart")) || [];

        const cartItems = document.getElementById("cart-items");
        const cartSummary = document.getElementById("cart-summary");

        function displayCart() {

            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty">
                        <h2>Your cart is empty</h2>
                        <p>Add some products to your cart.</p>
                    </div>
                `;

                cartSummary.innerHTML = "";

                return;
            }

            cartItems.innerHTML = "";

            let total = 0;

            cart.forEach((item, index) => {

                const quantity = Number(item.quantity) || 1;
                const price = Number(item.price) || 0;

                total += price * quantity;

                const itemDiv = document.createElement("div");
                itemDiv.className = "cart-item";

                const image = document.createElement("img");
                image.src = item.image;
                image.alt = item.name;

                const info = document.createElement("div");
                info.className = "item-info";

                const name = document.createElement("h3");
                name.textContent = item.name;

                const priceText = document.createElement("div");
                priceText.className = "price";
                priceText.textContent = "₹" + price;

                const quantityDiv = document.createElement("div");
                quantityDiv.className = "quantity";

                const minus = document.createElement("button");
                minus.textContent = "-";

                const quantityText = document.createElement("span");
                quantityText.textContent = quantity;

                const plus = document.createElement("button");
                plus.textContent = "+";

                const remove = document.createElement("button");
                remove.className = "remove-btn";
                remove.textContent = "Remove";

                minus.addEventListener("click", () => {

                    if (cart[index].quantity > 1) {
                        cart[index].quantity--;
                    }

                    saveCart();
                });

                plus.addEventListener("click", () => {

                    cart[index].quantity++;

                    saveCart();
                });

                remove.addEventListener("click", () => {

                    cart.splice(index, 1);

                    saveCart();
                });

                quantityDiv.appendChild(minus);
                quantityDiv.appendChild(quantityText);
                quantityDiv.appendChild(plus);

                info.appendChild(name);
                info.appendChild(priceText);
                info.appendChild(quantityDiv);
                info.appendChild(remove);

                itemDiv.appendChild(image);
                itemDiv.appendChild(info);

                cartItems.appendChild(itemDiv);
            });

            cartSummary.innerHTML = `
                <div class="total">
                    Total: ₹${total}
                </div>

                <button class="checkout-btn" onclick="goToCheckout()">
                    Proceed to Checkout
                </button>
            `;
        }

        function saveCart() {

            localStorage.setItem("hsCart", JSON.stringify(cart));

            displayCart();
        }

        function goToCheckout() {

            window.location.href = "index.html#checkout-section";
        }

        displayCart();

    </script>

</body>
</html>
